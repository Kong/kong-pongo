# kong_scram authenticates with scram-sha-256, which is what makes the server
# offer SCRAM-SHA-256-PLUS and exercise SCRAM channel binding. It has to come
# before the catch-all cert line below, which never negotiates SCRAM at all
hostssl     all     kong_scram  0.0.0.0/0   scram-sha-256

hostssl     all     all     0.0.0.0/0   cert clientcert=verify-full
hostnossl   all     all     0.0.0.0/0   trust
local       all     all                 trust
