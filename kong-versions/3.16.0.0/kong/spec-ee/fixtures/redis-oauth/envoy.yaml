# Envoy in front of OSS Redis, translating an OAuth2 access token into a
# static upstream password.
#
#   client --AUTH <token>--> [redis_proxy] --(gRPC Authenticate)--> auth-service
#                                   |
#                                   +--AUTH <static-pass>--> upstream Redis
#
# Downstream auth is delegated to the external auth gRPC service (it validates
# the JWT against Kong's test Keycloak). Upstream auth uses a static password
# (requirepass) configured per-cluster. The client's token never reaches
# Redis; the static password never reaches the client.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: redis_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 6379 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.redis_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
                stat_prefix: redis
                settings:
                  op_timeout: 5s
                prefix_routes:
                  catch_all_route:
                    cluster: redis_cluster
                # Downstream client auth -> external gRPC validator.
                external_auth_provider:
                  enable_auth_expiration: true
                  grpc_service:
                    envoy_grpc:
                      cluster_name: redis_auth
                    timeout: 2s

  clusters:
    # Upstream OSS Redis. Envoy authenticates to it with a STATIC password.
    - name: redis_cluster
      type: STRICT_DNS
      lb_policy: MAGLEV
      load_assignment:
        cluster_name: redis_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: redis-oauth-upstream, port_value: 6379 }
      typed_extension_protocol_options:
        envoy.filters.network.redis_proxy:
          "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProtocolOptions
          # `requirepass` => default user, password only (no auth_username).
          auth_password:
            inline_string: "Upstr3am-Static-Pass!"

    # The external auth gRPC service (HTTP/2 / h2c, no TLS for the test fixture).
    - name: redis_auth
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: redis_auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: redis-oauth-auth-service, port_value: 50051 }
