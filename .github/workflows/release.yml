name: Release

# Cuts a release: tags the current commit and publishes a GitHub release with
# generated notes, which is the manual "tag as x.y.z, push the tag, in Github
# UI create a release from the tag" part of the checklist in CHANGELOG.md.
#
# Run it from the Actions tab against master, after the "chore(release):
# release x.y.z" PR has merged.
#
# A release that fails part way can be run again with 'recreate' ticked; the
# tag and release left behind by the failed attempt are deleted first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a "v" (e.g. 2.29.0). Must already be committed to pongo.sh, the README logo and the changelog.'
        required: true
        type: string
      commit:
        description: 'Commit to tag. Defaults to the head of the branch this runs against. Use it when a later commit has already landed on master, so the tag still lands on the release commit.'
        required: false
        default: ''
        type: string
      recreate:
        description: 'Delete the existing tag and release for this version first. Only for retrying a failed release - it removes a published release.'
        required: false
        default: false
        type: boolean

# the release is created with the default token
permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        # full history and tags, so the generated notes have something to
        # compare against and so existing tags can be detected
        fetch-depth: 0

    - name: Resolve and check the commit to tag
      id: target
      env:
        VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$VERSION' is not an x.y.z version"
          exit 1
        fi

        # default to whatever ref this run was started against
        target=${COMMIT:-$GITHUB_SHA}

        if ! sha=$(git rev-parse -q --verify "$target^{commit}"); then
          echo "::error::'$target' is not a commit in this repository"
          exit 1
        fi

        # releases are cut from master, whichever ref the run started from
        git fetch --no-tags --quiet origin master
        if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
          echo "::error::$sha is not on master"
          exit 1
        fi

        # read the files at the commit being tagged rather than from the
        # checked out tree, so the check follows the tag and not the ref.
        # Captured first rather than piped into grep: 'grep -q' exits on the
        # first match, which SIGPIPEs 'git show', and pipefail then aborts.
        pongo_sh=$(git show "$sha:pongo.sh")
        readme=$(git show "$sha:README.md")
        changelog=$(git show "$sha:CHANGELOG.md")

        escaped=${VERSION//./\\.}
        failed=false

        if ! grep -q "^  PONGO_VERSION=$escaped\$" <<< "$pongo_sh"; then
          found=$(grep -m1 '^  PONGO_VERSION=' <<< "$pongo_sh" || echo none)
          echo "::error::PONGO_VERSION in pongo.sh is not $VERSION at $sha (found: $found)"
          failed=true
        fi

        if ! grep -q "v$escaped\$" <<< "$readme"; then
          echo "::error::the version in the README logo is not v$VERSION at $sha"
          failed=true
        fi

        if ! grep -q "^## $escaped released " <<< "$changelog"; then
          echo "::error::no '## $VERSION released <date>' heading in CHANGELOG.md at $sha; an 'unreleased' heading means the release commit is missing"
          failed=true
        fi

        if [[ "$failed" == "true" ]]; then
          echo "::error::run the 'chore(release): release $VERSION' PR first, then re-run this workflow"
          exit 1
        fi

        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "will tag $sha ($(git log -1 --format=%s "$sha"))"

    - name: Remove the tag and release from a failed attempt
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        RECREATE: ${{ inputs.recreate }}
      run: |
        set -euo pipefail

        # plain '&&' assignments would trip 'set -e' when the check fails
        tag_exists=false
        release_exists=false
        if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
          tag_exists=true
        fi
        if gh release view "$VERSION" > /dev/null 2>&1; then
          release_exists=true
        fi

        if [[ "$tag_exists" == "false" ]] && [[ "$release_exists" == "false" ]]; then
          echo "nothing to clean up"
          exit 0
        fi

        if [[ "$RECREATE" != "true" ]]; then
          echo "::error::tag exists: $tag_exists, release exists: $release_exists."
          echo "::error::$VERSION has been released already. If a previous attempt failed and you want to replace it, re-run this workflow with 'recreate' ticked. Note that this deletes the existing release."
          exit 1
        fi

        if [[ "$release_exists" == "true" ]]; then
          echo "deleting the existing release $VERSION"
          # --cleanup-tag takes the tag with it
          gh release delete "$VERSION" --yes --cleanup-tag
        fi

        # a tag with no release behind it, or one --cleanup-tag left behind
        if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
          echo "deleting the existing tag $VERSION"
          git push origin --delete "refs/tags/$VERSION"
        fi

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        TARGET_SHA: ${{ steps.target.outputs.sha }}
      run: |
        set -euo pipefail

        # 'gh release create' creates the tag at --target, so the tag and the
        # release are made together and 'recreate' can undo both as a pair
        gh release create "$VERSION" \
          --target "$TARGET_SHA" \
          --title "Release $VERSION" \
          --generate-notes

        url=$(gh release view "$VERSION" --json url --jq .url)
        echo "released $VERSION: $url"
        {
          echo "### Released \`$VERSION\`"
          echo
          echo "- commit: \`$TARGET_SHA\`"
          echo "- release: $url"
        } >> "$GITHUB_STEP_SUMMARY"
